name: Live RAG Retrieval Evaluation

on:
  push:
    branches:
      - feature/knowledge-testing-rag
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of evaluation cases (default: all 304 cases)"
        required: false
        default: "304"

jobs:
  retrieval-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live retrieval evaluation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAG_EVAL_LIMIT: ${{ inputs.limit || '304' }}
          RAG_EVAL_OUTPUT: retrieval_evaluation.json
        run: |
          python -m eval.evaluate_retrieval
          echo "Evaluation report:"
          cat retrieval_evaluation.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-evaluation
          path: retrieval_evaluation.json
          if-no-files-found: warn
