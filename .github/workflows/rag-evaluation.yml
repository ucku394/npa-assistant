name: RAG Evaluation
on:
  push:
    branches:
      - feature/knowledge-testing-rag
      - main
  pull_request:
    branches:
      - main
jobs:
  rag-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests
      - run: python -m eval.evaluate_rag
