[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# Correctness-focused baseline; tighten gradually.
select = ["E9", "F", "B006", "B023"]

[tool.ruff.lint.per-file-ignores]
# scripts/upload.py defines retry closures that are called within the same loop iteration.
"scripts/upload.py" = ["B023"]
